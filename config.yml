          # 首页的求职信息（Markdown，行尾的 \ 表示换行）。求职季结束后整段删掉即可
          jobMarket: |
            **I am on the 2026–27 job market.**

            **Job Market Paper:** [Decoding the Factor Zoo: Insights from Arbitrage Trading](papers/factor-zoo-arbitrage/) (with Yuntong Wu)

            We use sophisticated arbitrageurs' observed trading as an informed indicator of mispricing to classify the 212 factors of the factor zoo, conservatively identifying 29 as mispricing. A Common Mispricing Factor built from a high-conviction core of these factors is unspanned by every leading model, and a three-factor model (MKT, SMB, CMF) prices the unclassified factors as well as leading benchmark models.

            **Fields:** Asset pricing, behavioral finance (primary); macroeconomics, macro-finance (secondary)\
            **Expected completion:** June 2027\
            **References:** Alonso Villacorta (advisor), Hikaru Saijo (co-advisor), Galina Hale (committee member)

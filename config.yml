baseURL: "https://www.yuchaoli.com/"
title: Yuchao Li
theme: PaperMod
copyright: "© 2026 Yuchao Li"

enableInlineShortcodes: true
enableRobotsTXT: true
disableKinds: [taxonomy, term]
pagination:
  pagerSize: 20

menu:
    main:
        - name: Research
          url: papers/
          weight: 1
        - name: Teaching
          url: teaching/
          weight: 2
        - name: CV
          url: Li_Yuchao_CV.pdf
          weight: 3
        - name: 中文简历
          url: Li_Yuchao_CV_zh.pdf
          weight: 4
          pre: '<span lang="zh">'
          post: '</span>'

params:
    description: "Yuchao Li is a Ph.D. candidate in Economics at the University of California, Santa Cruz, working on asset pricing and behavioral finance. He is on the 2026–27 job market."
    author: Yuchao Li
    # 分享链接时的预览图（Open Graph），1200×630，源文件和生成方法见 og-image/。
    # 换图后改成 og.jpg?v=2、?v=3……，否则 LinkedIn 等平台可能继续显示缓存的旧图
    images: ["og.jpg"]
    DateFormat: January 2006
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: [papers]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    # 公式渲染默认关闭。需要公式的页面在 front matter 里写 math: true（KaTeX 已放在 static/katex/，不走外部 CDN）
    math: false
    profileMode:
          enabled: true
          title: Yuchao Li
          subtitle: "I am a Ph.D. candidate in Economics at the University of California, Santa Cruz, with a Designated Emphasis in Data Science. My research focuses on asset pricing and behavioral finance, with secondary interests in macro-finance and macroeconomics."
          # 首页简介下面的求职信息：status 是加粗的第一行；items 每项一行，左边是灰色标签，右边是内容（Markdown）。
          # 求职季结束后删掉 status 和前三项，只留 Email；预览图 static/og.jpg 里也有求职那一行，要一起重新生成
          jobMarket:
            status: "I am on the 2026–27 job market."
            items:
              - label: Job market paper
                value: "[Decoding the Factor Zoo: Insights from Arbitrage Trading](papers/factor-zoo-arbitrage/) (with Yuntong Wu)"
              - label: References
                value: "[Alonso Villacorta](https://sites.google.com/site/alonsovillacorta/) (advisor), [Hikaru Saijo](https://hsaijo.github.io/) (co-advisor), [Galina Hale](https://sites.google.com/view/galinahale/home) (committee member)"
              - label: Expected completion
                value: June 2027
              - label: Email
                value: "[yli852@ucsc.edu](mailto:yli852@ucsc.edu)"
          imageUrl: picture.jpeg
          imageWidth: 130
          imageHeight: 130
          buttons:
            - name: Research
              url: papers/
            - name: Teaching
              url: teaching/
            - name: CV
              url: Li_Yuchao_CV.pdf
            # 中文简历：PDF 由 Overleaf 自动同步。static/ 里还没有这个文件时，按钮不显示
            - name: 中文简历
              url: Li_Yuchao_CV_zh.pdf
              lang: zh

    socialIcons:
        - name: Email
          url: mailto:yli852@ucsc.edu
        - name: LinkedIn
          url: https://www.linkedin.com/in/li-yuchao/
        - name: GitHub
          url: https://github.com/Yuchao-Li2025

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: Yuchao Li
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn
    tableOfContents:
        endLevel: 2
